name: Kabari grup
description: Kirim satu pesan ke grup tim lewat OPS_ALERT_WEBHOOK_URL.
inputs:
  pesan:
    description: Isi pesan.
    required: true
  webhook:
    description: URL webhook (secrets.OPS_ALERT_WEBHOOK_URL). Kosong = pesan cuma dicetak.
    required: false
    default: ""
  label:
    description: Awalan pesan, biasanya domain situs, jadi "[label] pesan".
    required: false
    default: ""
  wajib:
    description: true = job gagal kalau pesannya tidak terkirim.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PESAN: ${{ inputs.pesan }}
        WEBHOOK: ${{ inputs.webhook }}
        LABEL: ${{ inputs.label }}
        WAJIB: ${{ inputs.wajib }}
      run: node "$GITHUB_ACTION_PATH/main.mjs"
